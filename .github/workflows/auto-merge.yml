# task and should be included in the git repository. Please do not edit it manually.

name: Auto-merge bot dependency PRs
env: {}
'on':
  pull_request_target:
    types:
    - opened
    - reopened
    - synchronize
    - ready_for_review
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
  checks: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  auto-merge:
    name: auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: false
    if: ${{ (((github.event_name == 'workflow_dispatch') || (github.event.pull_request.user.login == 'dependabot[bot]')) || (github.event.pull_request.user.login == 'renovate[bot]')) || (github.event.pull_request.user.login == 'zio-scala-steward[bot]') }}
    steps:
    - name: Check App Token
      id: check-app-token
      run: |
        if [ -n "$APP_ID" ]; then
          echo "configured=true" >> "$GITHUB_OUTPUT"
        else
          echo "configured=false" >> "$GITHUB_OUTPUT"
        fi
      env:
        APP_ID: ${{ secrets.APP_ID }}
    - name: Generate Token
      id: generate-token
      uses: zio/generate-github-app-token@v1.0.0
      if: ${{ steps.check-app-token.outputs.configured == 'true' }}
      with:
        app_id: ${{ secrets.APP_ID }}
        app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
    - name: Merge bot PR once CI passes
      if: ${{ github.event_name == 'pull_request_target' }}
      run: |
        set -euo pipefail
        while true; do
          checks=$(gh pr checks "$PR" --json name,bucket \
            --jq '[.[] | select(.name != "auto-merge" and .name != "auto-approve-bot-prs")]' 2>/dev/null || true)
          checks=${checks:-[]}
          total=$(jq length <<< "$checks")
          pending=$(jq '[.[] | select(.bucket == "pending")] | length' <<< "$checks")
          failed=$(jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length' <<< "$checks")
          if [ "$failed" -gt 0 ]; then
            echo "CI failed, not merging:"
            jq -r '.[] | select(.bucket == "fail" or .bucket == "cancel") | .name' <<< "$checks"
            exit 1
          fi
          if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
            break
          fi
          echo "Waiting for CI ($total checks, $pending pending)..."
          sleep 30
        done
        gh pr merge --squash "$PR"
      env:
        GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        PR: ${{ github.event.number }}
    - name: Backfill auto-merge for existing bot PRs
      if: ${{ github.event_name == 'workflow_dispatch' }}
      run: |
        set -euo pipefail
        for actor in "dependabot[bot]" "renovate[bot]" "zio-scala-steward[bot]"; do
          gh pr list \
            --author "$actor" \
            --state open \
            --json number \
            --jq '.[].number' | \
          xargs -I{} gh pr merge --auto --squash {}
        done
      env:
        GH_TOKEN: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
