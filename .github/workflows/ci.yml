# This file was autogenerated using `zio-sbt-ci` plugin via `sbt ciGenerateGithubWorkflow`
# task and should be included in the git repository. Please do not edit it manually.

name: CI
env:
  JDK_JAVA_OPTIONS: -Xms6G -Xmx6G -XX:+UseG1GC --add-exports java.base/sun.nio.ch=ALL-UNNAMED
'on':
  workflow_dispatch: {}
  release:
    types:
    - published
  push:
    branches:
    - master
  pull_request:
    branches-ignore:
    - gh-pages
permissions:
  id-token: write
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build ${{ matrix.build }}
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        build:
        - 3.3.x base
        - 2.12.x db
        - 2.12.x codegen
        - 2.12.x bigdata
        - 2.13.x db
        - 2.13.x codegen
        - 2.13.x bigdata
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Setup Scala
      uses: actions/setup-java@v6.0.1
      with:
        distribution: corretto
        java-version: '17'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Build modules
      run: |-
        read -r SCALA_VERSION MODULE <<< "${{ matrix.build }}"
        export SCALA_VERSION
        echo "SCALA_VERSION='$SCALA_VERSION'"
        ./build/build.sh "$MODULE"
      env:
        POSTGRES_PASSWORD: postgres
        MYSQL_PASSWORD: root
  docs:
    name: Docs
    runs-on: ubuntu-latest
    continue-on-error: false
    if: ${{ github.event_name == 'pull_request' }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Setup Scala
      uses: actions/setup-java@v6.0.1
      with:
        distribution: corretto
        java-version: '17'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Check if the README file is up to date
      run: sbt --no-colors docs/checkReadme
    - name: Check website build process
      run: rm -rf website; sbt --no-colors docs/clean; sbt --no-colors docs/buildWebsite
  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Setup Scala
      uses: actions/setup-java@v6.0.1
      with:
        distribution: corretto
        java-version: '17'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Check if the site workflow is up to date
      run: sbt --no-colors ciCheckGithubWorkflow
    - name: Check scalafmt
      run: sbt --no-colors scalafmtCheckAll
  update-readme:
    name: Update README
    runs-on: ubuntu-latest
    continue-on-error: false
    permissions:
      contents: read
      pull-requests: write
    if: ${{ (github.event_name == 'release') && (github.event.action == 'published') }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Install libuv
      run: sudo apt-get update && sudo apt-get install -y libuv1-dev
    - name: Setup Scala
      uses: actions/setup-java@v6.0.1
      with:
        distribution: corretto
        java-version: '17'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Generate Readme
      run: sbt --no-colors docs/generateReadme
    - name: Generate Token
      id: generate-token
      uses: zio/generate-github-app-token@v1.0.0
      with:
        app_id: ${{ secrets.APP_ID }}
        app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
    - name: Create Pull Request
      id: cpr
      uses: peter-evans/create-pull-request@v8.1.1
      with:
        body: |-
          Autogenerated changes after running the `sbt docs/generateReadme` command of the [zio-sbt-website](https://zio.dev/zio-sbt) plugin.

          I will automatically update the README.md file whenever there is new change for README.md, e.g.
            - After each release, I will update the version in the installation section.
            - After any changes to the "docs/index.md" file, I will update the README.md file accordingly.
        branch: zio-sbt-website/update-readme
        base: ${{ github.event.repository.default_branch }}
        commit-message: Update README.md
        token: ${{ steps.generate-token.outputs.token }}
        delete-branch: true
        title: Update README.md
        add-paths: README.md
    - name: Approve PR
      if: ${{ steps.cpr.outputs.pull-request-number }}
      run: gh pr review "$PR_URL" --approve
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
    - name: Enable Auto-Merge
      if: ${{ steps.cpr.outputs.pull-request-number }}
      run: gh pr merge --auto --squash "$PR_URL" || gh pr merge --squash "$PR_URL"
      env:
        GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
  ci:
    name: ci
    runs-on: ubuntu-latest
    continue-on-error: false
    needs:
    - lint
    - build
    - docs
    if: always()
    steps:
    - name: Report Failed CI
      if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      run: 'echo "ci failed: one or more required jobs did not succeed"; exit 1'
    - name: Report Successful CI
      run: echo "ci passed"
  release:
    name: Release
    runs-on: ubuntu-latest
    continue-on-error: false
    needs:
    - ci
    if: ${{ (((github.event_name == 'release') && (github.event.action == 'published')) || (github.event_name == 'workflow_dispatch')) || ((github.event_name == 'push') && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Install libuv
      run: sudo apt-get update && sudo apt-get install -y libuv1-dev
    - name: Setup Scala
      uses: actions/setup-java@v6.0.1
      with:
        distribution: corretto
        java-version: '17'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Release
      run: |-
        sbt --no-colors ++2.12.x -Dquill.scala.version=2.12.x -Dquill.macro.log=false ci-release
        sbt --no-colors ++2.13.x -Dquill.scala.version=2.13.x -Dquill.macro.log=false ci-release
        sbt --no-colors ++3.3.x -Dquill.scala.version=3.3.x -Dquill.macro.log=false ci-release
      env:
        CI_SNAPSHOT_RELEASE: publish
        PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        CI_RELEASE: publishSigned
        SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        PGP_SECRET: ${{ secrets.PGP_SECRET }}
  release-docs:
    name: Release Docs
    runs-on: ubuntu-latest
    continue-on-error: false
    needs:
    - release
    if: ${{ ((github.event_name == 'release') && (github.event.action == 'published')) || (github.event_name == 'workflow_dispatch') }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Install libuv
      run: sudo apt-get update && sudo apt-get install -y libuv1-dev
    - name: Setup Scala
      uses: actions/setup-java@v6.0.1
      with:
        distribution: corretto
        java-version: '17'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Setup NodeJs
      uses: actions/setup-node@v7.0.0
      with:
        node-version: 24.12.0
        registry-url: https://registry.npmjs.org
    - name: Publish Docs to NPM Registry
      run: sbt --no-colors docs/publishToNpm
  notify-docs-release:
    name: Notify Docs Release
    runs-on: ubuntu-latest
    continue-on-error: false
    needs:
    - release-docs
    if: ${{ ((github.event_name == 'release') && (github.event.action == 'published')) || (github.event_name == 'workflow_dispatch') }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Check App Token
      id: check-app-token
      run: |
        if [ -n "$APP_ID" ]; then
          echo "configured=true" >> "$GITHUB_OUTPUT"
        else
          echo "configured=false" >> "$GITHUB_OUTPUT"
        fi
      env:
        APP_ID: ${{ secrets.APP_ID }}
    - name: Generate Token
      id: generate-token
      uses: zio/generate-github-app-token@v1.0.0
      if: ${{ steps.check-app-token.outputs.configured == 'true' }}
      with:
        app_id: ${{ secrets.APP_ID }}
        app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
    - name: notify the main repo about the new release of docs package
      run: |
        PACKAGE_NAME=$(cat docs/package.json | grep '"name"' | awk -F'"' '{print $4}')
        PACKAGE_VERSION=$(npm view $PACKAGE_NAME version)
        curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: token $NOTIFY_TOKEN"\
            https://api.github.com/repos/zio/zio/dispatches \
            -d '{
                  "event_type":"update-docs",
                  "client_payload":{
                    "package_name":"'"${PACKAGE_NAME}"'",
                    "package_version": "'"${PACKAGE_VERSION}"'"
                  }
                }'
      env:
        NOTIFY_TOKEN: ${{ steps.generate-token.outputs.token || secrets.PAT_TOKEN }}
